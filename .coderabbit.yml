# CodeRabbit AI code review configuration
# https://docs.coderabbit.ai/

reviews:
  profile: chill
  request_changes: true
  auto_label: true
  skip_title_pattern: ""

chat:
  auto_reply: true

language:
  javascript: true
  bash: true
  markdown: true
  json: true

exclude:
  - node_modules/
  - coverage/
  - dist/
  - build/
  - .git/

focus:
  - critical issues
  - security concerns
  - performance problems
  - best practices
  - code style consistency

ignore:
  - minor formatting
  - whitespace only changes
  - auto-generated files
