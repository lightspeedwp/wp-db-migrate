version: '3.9'

services:
  # Development environment with all tools
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: wp-db-migrate:dev
    container_name: wp-db-migrate-dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DEBUG=wp-db-migrate:*
      - VERBOSE=true
    working_dir: /app
    entrypoint: bash
    stdin_open: true
    tty: true

  # Production environment
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: wp-db-migrate:latest
    container_name: wp-db-migrate-prod
    environment:
      - NODE_ENV=production
    read_only: true
    security_opt:
      - no-new-privileges:true

  # Test runner
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: wp-db-migrate:test
    container_name: wp-db-migrate-test
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      - CI=true
    working_dir: /app
    command: npm test -- --coverage

  # Linting and validation
  lint:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: wp-db-migrate:lint
    container_name: wp-db-migrate-lint
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: |
      bash -c "
        echo 'Running linters...'
        shellcheck skill/scripts/*.sh || true
        npm run lint || true
        echo 'Lint complete'
      "

volumes:
  node_modules:

networks:
  default:
    name: wp-db-migrate-network
