version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "lightspeedwp/maintainers"
    labels:
      - "dependencies"
      - "type: enhancement"
    commit-message:
      prefix: "chore"
      prefix-scope: "deps"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    reviewers:
      - "lightspeedwp/maintainers"
    labels:
      - "github-actions"
      - "type: enhancement"
    commit-message:
      prefix: "chore"
      prefix-scope: "github-actions"
      include: "scope"
