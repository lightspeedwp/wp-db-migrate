name: Lint & Format

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint 2>/dev/null || echo "ESLint not configured"

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          for file in skill/scripts/*.sh; do
            echo "Checking $file"
            shellcheck "$file" || true
          done

      - name: Check JSON files
        run: |
          for file in *.json .claude/*.json; do
            if [ -f "$file" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))" && echo "✓ $file" || echo "✗ $file"
            fi
          done

      - name: Check YAML files
        run: |
          if command -v yamllint &> /dev/null; then
            yamllint .github/labeler.yml || true
          fi
